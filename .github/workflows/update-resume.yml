name: Update Resume Preview

on:
  push:
    branches:
      - main
    paths:
      - 'Subhabrata_Sahoo_Resume.pdf'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-preview:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Generate Preview in Workflows Folder & Update README
        run: |
          # 1. Clean up any existing preview images in root and .github/workflows
          rm -f resume-preview-*.png Subhabrata_Sahoo_Resume_Preview*.png .github/workflows/resume-preview-*.png

          # 2. Define image path inside .github/workflows/
          IMAGE_PATH=".github/workflows/resume-preview-${GITHUB_SHA::7}"

          # 3. Convert PDF to PNG inside .github/workflows/
          pdftoppm -png -f 1 -singlefile Subhabrata_Sahoo_Resume.pdf "$IMAGE_PATH"

          # 4. Rebuild README.md pointing to the nested image path
          cat > README.md <<EOF
          [![Resume Preview](./${IMAGE_PATH}.png)](./Subhabrata_Sahoo_Resume.pdf)

          **[Download Resume PDF](./Subhabrata_Sahoo_Resume.pdf)**
          EOF

      - name: Commit updated preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update resume preview [skip ci]"
            git push
          fi
