name: Update Resume Preview

on:
  push:
    branches:
      - main
    paths:
      - 'Subhabrata_Sahoo_Resume.pdf'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-preview:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Generate Multi-page Previews & Update README
        run: |
          # 1. Ensure asset folder exists
          mkdir -p .github/assets

          # 2. Clean up old preview images across the repo
          rm -f resume-preview-*.png Subhabrata_Sahoo_Resume_Preview*.png .github/assets/resume-preview-*.png

          # 3. Base prefix using short commit SHA
          SHA_PREFIX="resume-preview-${GITHUB_SHA::7}"

          # 4. Convert all pages of the PDF to PNGs (generates ${SHA_PREFIX}-1.png, ${SHA_PREFIX}-2.png, etc.)
          pdftoppm -png Subhabrata_Sahoo_Resume.pdf ".github/assets/${SHA_PREFIX}"

          # 5. Start building clean README
          cat > README.md <<EOF
          <p align="center">
            <a href="./Subhabrata_Sahoo_Resume.pdf"><b>Download Resume PDF</b></a>
          </p>
          EOF

          # 6. Append each generated page in order
          for img in $(ls .github/assets/${SHA_PREFIX}-*.png | sort -V); do
            cat >> README.md <<EOF

          [![Resume Page](./${img})](./Subhabrata_Sahoo_Resume.pdf)
          EOF
          done

          # 7. Add footer download link
          cat >> README.md <<EOF

          <p align="center">
            <a href="./Subhabrata_Sahoo_Resume.pdf"><b>Download Resume PDF</b></a>
          </p>
          EOF

      - name: Commit updated preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update multi-page resume preview [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
