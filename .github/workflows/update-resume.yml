name: Update Resume Preview

on:
  push:
    branches:
      - main
    paths:
      - 'Subhabrata_Sahoo_Resume.pdf'

permissions:
  contents: write

jobs:
  update-preview:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Create resume preview
        run: |
          pdftoppm -png -f 1 -singlefile \
            Subhabrata_Sahoo_Resume.pdf \
            Subhabrata_Sahoo_Resume_Preview

      - name: Update README
        run: |
          cat > README.md <<EOF
          [![Resume Preview](./Subhabrata_Sahoo_Resume_Preview.png?v=${{ github.run_id }})](./Subhabrata_Sahoo_Resume.pdf)

          **[Download Resume PDF](./Subhabrata_Sahoo_Resume.pdf)**
          EOF

      - name: Commit updated preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Subhabrata_Sahoo_Resume_Preview.png README.md

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update resume preview"
            git push
          fi
